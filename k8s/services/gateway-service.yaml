apiVersion: v1
kind: Service
metadata:
  name: antifraud-gateway
  namespace: antifraud
  labels:
    app: antifraud-gateway
    app.kubernetes.io/part-of: a2p-antifraud-platform
spec:
  type: NodePort
  selector:
    app: antifraud-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
