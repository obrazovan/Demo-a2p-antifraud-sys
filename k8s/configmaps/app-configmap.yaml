apiVersion: v1
kind: ConfigMap
metadata:
  name: antifraud-config
  namespace: antifraud
  labels:
    app.kubernetes.io/part-of: a2p-antifraud-platform
data:
  # Internal Kubernetes Service DNS endpoints (never localhost)
  RULE_ENGINE_URL: "http://service-rule-engine:8001"
  REPUTATION_URL: "http://service-reputation:8002"
  VELOCITY_URL: "http://service-velocity:8003"
  SCORING_URL: "http://service-scoring:8004"
  ANALYTICS_URL: "http://service-analytics:8005"
  ALERTING_URL: "http://service-alerting:8006"

  # Redis & ClickHouse connection parameters
  REDIS_URL: "redis://cache-redis:6379/0"
  CLICKHOUSE_HOST: "db-clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: "analytics_db"
  CLICKHOUSE_USER: "default"

  # PostgreSQL database names & users
  POSTGRES_RULES_DB: "rules_db"
  POSTGRES_RULES_USER: "postgres"
  POSTGRES_REPUTATION_DB: "reputation_db"
  POSTGRES_REPUTATION_USER: "postgres"

  # RabbitMQ topology & routing
  RABBITMQ_EXCHANGE: "antifraud.events"
  RABBITMQ_ROUTING_KEY: "inspection.completed"
  ANALYTICS_RABBITMQ_QUEUE: "analytics.raw_events"
  ALERTING_RABBITMQ_QUEUE: "security.alerts"

  # Application tuning & thresholds
  DENY_THRESHOLD: "60.0"
  CRITICAL_RISK_THRESHOLD: "80.0"
  BATCH_SIZE: "50"
  FLUSH_INTERVAL_SECONDS: "2.0"
  SQLITE_DB_PATH: "/data/alerts_audit.db"
  LOG_LEVEL: "INFO"
