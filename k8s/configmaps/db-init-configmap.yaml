apiVersion: v1
kind: ConfigMap
metadata:
  name: antifraud-db-init
  namespace: antifraud
  labels:
    app.kubernetes.io/part-of: a2p-antifraud-platform
data:
  rules-init.sql: |
    CREATE TABLE IF NOT EXISTS rules (
        id SERIAL PRIMARY KEY,
        name VARCHAR(128) UNIQUE NOT NULL,
        metric_type VARCHAR(32) NOT NULL,
        threshold_val DOUBLE PRECISION NOT NULL DEFAULT 0.0,
        weight DOUBLE PRECISION NOT NULL DEFAULT 10.0,
        is_active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_rules_name ON rules (name);
    CREATE INDEX IF NOT EXISTS idx_rules_metric_type ON rules (metric_type);
    CREATE INDEX IF NOT EXISTS idx_rules_is_active ON rules (is_active);
    INSERT INTO rules (name, metric_type, threshold_val, weight, is_active)
    VALUES
        ('High velocity IP (>10 req/min)', 'VELOCITY', 10.0, 40.0, true),
        ('High velocity Destination (>30 req/min)', 'VELOCITY', 30.0, 50.0, true),
        ('Blacklisted prefix/IP', 'REPUTATION', 0.0, 100.0, true)
    ON CONFLICT (name) DO NOTHING;

  reputation-init.sql: |
    CREATE TABLE IF NOT EXISTS blacklisted_entities (
        id SERIAL PRIMARY KEY,
        entity_type VARCHAR(16) NOT NULL,
        entity_val VARCHAR(64) NOT NULL,
        reason TEXT NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT uq_entity UNIQUE (entity_type, entity_val)
    );
    CREATE INDEX IF NOT EXISTS idx_entity_lookup ON blacklisted_entities (entity_type, entity_val);
    INSERT INTO blacklisted_entities (entity_type, entity_val, reason)
    VALUES
        ('IP', '198.51.100.24', 'Known Tor exit node / automated SMS pumping proxy'),
        ('MCC_MNC', '62801', 'Gabon test range - high-risk AIT destination')
    ON CONFLICT (entity_type, entity_val) DO NOTHING;

  clickhouse-init.sql: |
    CREATE DATABASE IF NOT EXISTS analytics_db;
    CREATE TABLE IF NOT EXISTS analytics_db.sms_inspections (
        event_time DateTime DEFAULT now(),
        request_id UUID,
        client_ip String,
        destination_phone String,
        mcc_mnc LowCardinality(String),
        verdict LowCardinality(String),
        risk_score Float32,
        latency_ms Float32,
        reasons Array(String)
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMM(event_time)
    ORDER BY (event_time, verdict, mcc_mnc);
