apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-velocity
  namespace: antifraud
  labels:
    app: service-velocity
    tier: backend
    app.kubernetes.io/part-of: a2p-antifraud-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-velocity
  template:
    metadata:
      labels:
        app: service-velocity
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: service-velocity
          image: lab2-service-velocity:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: SERVICE_NAME
              value: "service-velocity"
            - name: PORT
              value: "8003"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: antifraud-config
                  key: REDIS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: antifraud-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
