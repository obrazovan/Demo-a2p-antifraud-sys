# Template for Kubernetes Secret `antifraud-secrets`.
# In production, generate via `kubectl create secret generic` or SealedSecrets/ExternalSecrets:
#   kubectl create secret generic antifraud-secrets -n antifraud \
#     --from-literal=POSTGRES_RULES_PASSWORD='<password>' ...
apiVersion: v1
kind: Secret
metadata:
  name: antifraud-secrets
  namespace: antifraud
  labels:
    app.kubernetes.io/part-of: a2p-antifraud-platform
type: Opaque
stringData:
  POSTGRES_RULES_PASSWORD: "<CHANGE_ME>"
  POSTGRES_REPUTATION_PASSWORD: "<CHANGE_ME>"
  RULES_DATABASE_URL: "postgresql+asyncpg://postgres:<CHANGE_ME>@db-postgres-rules:5432/rules_db"
  REPUTATION_DATABASE_URL: "postgresql+asyncpg://postgres:<CHANGE_ME>@db-postgres-reputation:5432/reputation_db"
  RABBITMQ_DEFAULT_USER: "<CHANGE_ME>"
  RABBITMQ_DEFAULT_PASS: "<CHANGE_ME>"
  RABBITMQ_URL: "amqp://<CHANGE_ME>:<CHANGE_ME>@broker-rabbitmq:5672/"
  CLICKHOUSE_PASSWORD: "<CHANGE_ME>"
  GATEWAY_API_KEYS: "<CHANGE_ME>"
  GATEWAY_BASIC_USER: "<CHANGE_ME>"
  GATEWAY_BASIC_PASS: "<CHANGE_ME>"
