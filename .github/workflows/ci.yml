name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-orchestration:
    name: Validate Docker Compose & Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config -q

      - name: Validate Kubernetes manifests with Kustomize
        run: kubectl kustomize k8s/ > /dev/null

  test-services:
    name: Test Microservices & K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml -r gateway/requirements.txt -r services/rule-engine/requirements.txt -r services/reputation/requirements.txt -r services/velocity/requirements.txt -r services/scoring/requirements.txt -r services/analytics/requirements.txt -r services/alerting/requirements.txt

      - name: Run pytest
        run: python -m pytest -v
